name = "pki"
description = "Air-gapped PKI appliance (plain Fedora minimal-raw, no ostree)"
version = "0.1.0"

packages = [
    { name = "audit" },
    { name = "cryptsetup" },
    { name = "direnv" },
    { name = "gnupg2" },
    { name = "gnutls-utils" },
    { name = "jq" },
    { name = "libblockdev-crypto" },
    { name = "libblockdev-fs" },
    { name = "opensc" },
    { name = "openssl" },
    { name = "paperkey" },
    { name = "pcsc-lite" },
    { name = "pcsc-lite-ccid" },
    { name = "pinentry" },
    { name = "pkcs11-provider" },
    { name = "udisks2" },
    { name = "vim" },
    { name = "yubikey-manager" },
    # custom package with 'pki' command
    { name = "pki" },
]

[customizations]
hostname = "pki"

[customizations.kernel]
# loglevel=3            only log errors and above so we don't spam the console
# lockdown              restrict root's access to the running kernel
# module.sig_enforce    refuse to load unsigned modules
# init_on_alloc/free    zero heap pages on alloc and free
# slab_nomerge          keep slab caches separate to blunt heap exploits
# randomize_kstack      randomize the kernel stack offset per syscall
append = "loglevel=3 lockdown=confidentiality module.sig_enforce=1 init_on_alloc=1 init_on_free=1 slab_nomerge randomize_kstack_offset=1"

[customizations.services]
masked = [ "initial-setup", "NetworkManager", "bluetooth", "wpa_supplicant", "avahi-daemon" ]

# Locked, non-root operator. No root user is defined: root's password stays
# locked and access to the host is tty1 autologin as alice only.
[[customizations.user]]
name = "alice"
description = "PKI appliance operator"
shell = "/bin/bash"
home = "/home/alice"

[[customizations.files]]
path = "/etc/sudoers.d/alice"
mode = "0440"
user = "root"
group = "root"
data = "alice ALL=(ALL:ALL) NOPASSWD: /sbin/shutdown\n"

[[customizations.directories]]
path = "/etc/systemd/system/getty@tty1.service.d"
mode = "0755"
user = "root"
group = "root"

[[customizations.files]]
path = "/etc/systemd/system/getty@tty1.service.d/autologin.conf"
mode = "0644"
user = "root"
group = "root"
data = """
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin alice --noclear %I $TERM
"""

# polkit rule: allow alice to mount/unmount, unlock/lock and FORMAT removable
# media via udisks2. The non-"-system" udisks2 action ids apply exclusively to
# hotplugged/USB devices, so the internal OS disk (mmcblk/SD) is never in
# scope.
[[customizations.files]]
path = "/etc/polkit-1/rules.d/50-alice.rules"
mode = "0644"
user = "root"
group = "root"
data = """
polkit.addRule(function(action, subject) {
    if (subject.user !== "alice") {
        return;
    }

    // udisks2 on REMOVABLE media only: mount/unmount, unlock/lock, and
    // format (Format is what creates the LUKS container). The "-system"
    // variants are deliberately omitted so fixed disks stay off-limits.
    switch (action.id) {
    case "org.freedesktop.udisks2.filesystem-mount":
    case "org.freedesktop.udisks2.filesystem-unmount-others":
    case "org.freedesktop.udisks2.encrypted-unlock":
    case "org.freedesktop.udisks2.encrypted-lock-others":
    case "org.freedesktop.udisks2.modify-device":
        return polkit.Result.YES;
    }
});
"""

# Shell wrapper so `pki workspace up` drops the shell into the workspace and
# `pki workspace down` returns it home. A child process cannot change the
# shell's cwd, so this must live in the shell itself.
[[customizations.files]]
path = "/etc/profile.d/pki.sh"
mode = "0644"
user = "root"
group = "root"
data = """
pki() {
    local ws
    command pki "$@" || return
    if [ "$1" = "workspace" ]; then
        ws="$(command pki workspace path)" || return 0
        case "$2" in
        up) cd "$ws" ;;
        down)
            case "$PWD" in
            "$ws"*) cd "$HOME" ;;
            esac
            ;;
        esac
    fi
}
"""

# Install direnv globally, we'll use it to source .envrc in
[[customizations.files]]
path = "/etc/profile.d/direnv.sh"
mode = "0644"
user = "root"
group = "root"
data = """
export DIRENV_CONFIG=/etc/direnv
eval "$(direnv hook bash)"
"""

[[customizations.directories]]
path = "/etc/direnv"
mode = "0755"
user = "root"
group = "root"

# Explicitly allow .envrc files in the workspace. The workspace is a plain
# directory under the user's runtime dir (/run/user/<uid>/workspace) — a
# per-session tmpfs created by systemd-logind — so it is RAM-backed, dies
# with the session, and needs no privileges, mount unit, or polkit grant:
#   pki workspace up      # create + populate
#   pki workspace down    # remove (frees the RAM)
[[customizations.files]]
path = "/etc/direnv/config.toml"
mode = "0644"
user = "root"
group = "root"
data = """
[global]
strict_env = true

[whitelist]
prefix = [ "/run/user/" ]
"""

[[customizations.files]]
path = "/etc/modprobe.d/blockwireless.conf"
mode = "0644"
user = "root"
group = "root"
data = """
# `blacklist` stops udev/hotplug autoload; `install … /bin/false` also blocks
# manual and dependency-triggered loads. Both are used for defense in depth.

# Wi-Fi leaf drivers (Broadcom on Raspberry Pi)
blacklist brcmfmac
blacklist brcmfmac_wcc
install brcmfmac /bin/false
install brcmfmac_wcc /bin/false

# Wi-Fi subsystem
blacklist cfg80211
blacklist mac80211
blacklist brcmutil
install cfg80211 /bin/false
install mac80211 /bin/false
install brcmutil /bin/false

# Bluetooth stack
blacklist bluetooth
blacklist btbcm
blacklist hci_uart
blacklist btusb
blacklist bnep
blacklist btsdio
install bluetooth /bin/false
install btbcm /bin/false
install hci_uart /bin/false
install btusb /bin/false
install bnep /bin/false
install btsdio /bin/false
"""
